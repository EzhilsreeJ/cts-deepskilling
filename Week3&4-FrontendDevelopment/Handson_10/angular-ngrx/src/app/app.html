<div class="container">
  <h1>NgRx Course List</h1>

  <div *ngIf="loading" class="loading">
    Loading...
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngFor="let course of courses" class="course-card">
    <h3>{{ course.title }}</h3>
    <p>{{ course.body }}</p>
  </div>
</div>
